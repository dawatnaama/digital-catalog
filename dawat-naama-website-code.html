<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dawat Naama — Luxury Digital Wedding Invitations</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400;1,500;1,600&family=Montserrat:wght@300;400;500;600&family=Alex+Brush&display=swap" rel="stylesheet">
<style>
:root {
  --ivory: #faf7f2;
  --cream: #f4eee2;
  --paper-edge: #dcd4c3;
  --burgundy: #5a1827;
  --gold: #bda068;
  --gold-light: #dfc896;
  --gold-dark: #8c7343;
  --ink: #1f1b18;
  --navy: #1b2f4f;
  --ease-cinematic: cubic-bezier(0.25, 1, 0.3, 1);
  --ease-smooth: cubic-bezier(0.4, 0, 0.2, 1);
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-font-smoothing: antialiased;
}

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background-color: #120e0d;
  color: var(--ivory);
  font-family: 'Cormorant Garamond', Georgia, serif;
}

/* ─────────────────────────────────────────────────────────────
   STAGE / VIEWPORT WRAPPER
   ───────────────────────────────────────────────────────────── */
.viewport {
  position: relative;
  width: 100vw;
  height: 100vh;
  height: 100svh;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
  background: radial-gradient(circle at 50% 45%, #2a201c 0%, #171110 60%, #0d0a09 100%);
  perspective: 1600px;
}

/* Ambient warm lighting behind the card */
.ambient-glow {
  position: absolute;
  width: 90vmin;
  height: 90vmin;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(189,160,104,0.18) 0%, rgba(90,24,39,0.12) 45%, transparent 70%);
  filter: blur(40px);
  pointer-events: none;
  z-index: 1;
  transition: opacity 1.8s var(--ease-cinematic);
}

/* ─────────────────────────────────────────────────────────────
   THE CONTINUOUS INVITATION -> HERO VESSEL
   Transforms seamlessly from a 3D physical card into the full-screen Hero
   ───────────────────────────────────────────────────────────── */
.card-vessel {
  position: relative;
  width: min(80vw, 410px);
  height: min(84svh, 690px);
  min-height: 480px;
  transform-style: preserve-3d;
  z-index: 10;
  cursor: pointer;
  touch-action: pan-y;
  transition: width 1.8s var(--ease-cinematic),
              height 1.8s var(--ease-cinematic),
              transform 1.8s var(--ease-cinematic),
              border-radius 1.8s var(--ease-cinematic),
              box-shadow 1.8s var(--ease-cinematic);
  box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.65),
              0 0 0 1px rgba(189, 160, 104, 0.25);
  border-radius: 4px;
}

/* When opening begins, prepare camera perspective */
.viewport.is-opening .card-vessel {
  box-shadow: 0 35px 70px -15px rgba(0, 0, 0, 0.75);
}

/* When transitioning into Hero, expand smoothly to full viewport */
.viewport.hero-active .card-vessel {
  width: 100vw;
  height: 100vh;
  height: 100svh;
  min-height: 100%;
  border-radius: 0;
  cursor: default;
  box-shadow: none;
  transform: translate3d(0, 0, 0) scale(1) !important;
}

/* ─────────────────────────────────────────────────────────────
   INNER CARD (Contains the Live Wedding Background Video)
   ───────────────────────────────────────────────────────────── */
.card-inner {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background-color: var(--cream);
  z-index: 2;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: border-radius 1.8s var(--ease-cinematic);
}

/* The Wedding Decoration Video Background */
.wedding-video-bg {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center 35%;
  opacity: 0.35;
  filter: contrast(1.05) saturate(1.1);
  transform: scale(1.08);
  transition: opacity 1.8s var(--ease-cinematic),
              transform 2.2s var(--ease-cinematic),
              filter 1.8s var(--ease-cinematic);
  will-change: opacity, transform;
}

/* Once Hero is active, video comes to full vibrant presence */
.viewport.hero-active .wedding-video-bg {
  opacity: 0.82;
  filter: contrast(1.08) saturate(1.15) brightness(0.92);
  transform: scale(1);
}

/* Cinematic Dark & Warm Vignette Overlay for Readability */
.video-overlay {
  position: absolute;
  inset: 0;
  background: radial-gradient(circle at 50% 50%, rgba(18,14,13,0.3) 0%, rgba(18,14,13,0.7) 75%, rgba(10,8,7,0.92) 100%);
  pointer-events: none;
  opacity: 0.85;
  transition: opacity 1.8s var(--ease-cinematic), background 1.8s var(--ease-cinematic);
  z-index: 2;
}

.viewport.hero-active .video-overlay {
  background: radial-gradient(circle at 50% 45%, rgba(18,14,13,0.4) 0%, rgba(18,14,13,0.75) 65%, rgba(10,8,7,0.96) 100%);
  opacity: 0.88;
}

/* Traditional Floral Border Frame (from reference) */
.inner-card-frame {
  position: absolute;
  inset: 8px;
  background: url('inner-card-frame.png') center/100% 100% no-repeat;
  pointer-events: none;
  z-index: 3;
  opacity: 0.95;
  transition: opacity 1.2s var(--ease-cinematic), transform 1.6s var(--ease-cinematic);
}

/* The frame dissolves outward seamlessly during Hero expansion */
.viewport.hero-active .inner-card-frame {
  opacity: 0;
  transform: scale(1.15);
}

/* ─────────────────────────────────────────────────────────────
   INITIAL INVITATION CARD CONTENT (Discreet preview before expand)
   ───────────────────────────────────────────────────────────── */
.card-content-initial {
  position: relative;
  z-index: 5;
  width: 72%;
  max-width: 280px;
  text-align: center;
  color: var(--ivory);
  text-shadow: 0 2px 10px rgba(0,0,0,0.7);
  opacity: 0;
  transform: translateY(20px) scale(0.95);
  transition: opacity 0.8s var(--ease-smooth), transform 0.8s var(--ease-smooth);
  pointer-events: none;
}

.viewport.is-opening .card-content-initial {
  opacity: 1;
  transform: translateY(0) scale(1);
}

.viewport.hero-active .card-content-initial {
  opacity: 0;
  transform: translateY(-30px) scale(0.9);
  transition: opacity 0.6s var(--ease-smooth), transform 0.6s var(--ease-smooth);
}

.initial-logo {
  width: 70px;
  height: 70px;
  object-fit: contain;
  margin: 0 auto 12px;
  filter: drop-shadow(0 4px 8px rgba(0,0,0,0.6));
}

.initial-subtitle {
  font-family: 'Montserrat', sans-serif;
  font-size: 8px;
  font-weight: 500;
  letter-spacing: 0.28em;
  text-transform: uppercase;
  color: var(--gold-light);
  margin-bottom: 8px;
}

.initial-title {
  font-size: clamp(26px, 6vw, 36px);
  font-weight: 400;
  line-height: 1.1;
  color: #ffffff;
  margin-bottom: 8px;
  font-style: italic;
}

.initial-tagline {
  font-size: 13px;
  font-style: italic;
  color: #dfdcd5;
}

/* ─────────────────────────────────────────────────────────────
   EXPANDED HERO SECTION CONTENT (Cinematic Reveal)
   ───────────────────────────────────────────────────────────── */
.hero-content {
  position: absolute;
  inset: 0;
  z-index: 10;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 24px;
  opacity: 0;
  pointer-events: none;
  transform: translateY(40px) scale(0.96);
  transition: opacity 1.4s var(--ease-cinematic) 0.5s,
              transform 1.4s var(--ease-cinematic) 0.5s;
}

.viewport.hero-active .hero-content {
  opacity: 1;
  pointer-events: auto;
  transform: translateY(0) scale(1);
}

.hero-crest {
  width: clamp(75px, 10vw, 105px);
  height: auto;
  margin-bottom: 18px;
  filter: drop-shadow(0 8px 24px rgba(0,0,0,0.65)) drop-shadow(0 0 16px rgba(189,160,104,0.3));
  opacity: 0;
  transform: translateY(20px);
  transition: opacity 1.2s var(--ease-cinematic) 0.8s, transform 1.2s var(--ease-cinematic) 0.8s;
}

.viewport.hero-active .hero-crest {
  opacity: 1;
  transform: translateY(0);
}

.hero-eyebrow {
  font-family: 'Montserrat', sans-serif;
  font-size: clamp(9px, 1.4vw, 12px);
  font-weight: 500;
  letter-spacing: 0.42em;
  text-transform: uppercase;
  color: var(--gold-light);
  margin-bottom: 14px;
  text-shadow: 0 2px 6px rgba(0,0,0,0.7);
  opacity: 0;
  transform: translateY(20px);
  transition: opacity 1.2s var(--ease-cinematic) 1.0s, transform 1.2s var(--ease-cinematic) 1.0s;
}

.viewport.hero-active .hero-eyebrow {
  opacity: 1;
  transform: translateY(0);
}

.hero-title {
  font-size: clamp(38px, 6.5vw, 76px);
  font-weight: 400;
  line-height: 1.05;
  letter-spacing: 0.04em;
  color: #ffffff;
  margin-bottom: 16px;
  max-width: 900px;
  text-shadow: 0 4px 20px rgba(0,0,0,0.85);
  opacity: 0;
  transform: translateY(24px);
  transition: opacity 1.2s var(--ease-cinematic) 1.2s, transform 1.2s var(--ease-cinematic) 1.2s;
}

.hero-title span {
  font-style: italic;
  font-weight: 300;
  color: var(--gold-light);
  display: inline-block;
}

.viewport.hero-active .hero-title {
  opacity: 1;
  transform: translateY(0);
}

.hero-tagline {
  font-size: clamp(16px, 2.2vw, 24px);
  font-weight: 400;
  font-style: italic;
  color: #f1ede4;
  margin-bottom: 36px;
  max-width: 680px;
  text-shadow: 0 2px 10px rgba(0,0,0,0.8);
  opacity: 0;
  transform: translateY(20px);
  transition: opacity 1.2s var(--ease-cinematic) 1.4s, transform 1.2s var(--ease-cinematic) 1.4s;
}

.viewport.hero-active .hero-tagline {
  opacity: 1;
  transform: translateY(0);
}

/* Hero Action Buttons */
.hero-actions {
  display: flex;
  gap: 16px;
  align-items: center;
  justify-content: center;
  flex-wrap: wrap;
  opacity: 0;
  transform: translateY(20px);
  transition: opacity 1.2s var(--ease-cinematic) 1.6s, transform 1.2s var(--ease-cinematic) 1.6s;
}

.viewport.hero-active .hero-actions {
  opacity: 1;
  transform: translateY(0);
}

.btn-primary {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 14px 34px;
  background: linear-gradient(135deg, #bda068 0%, #e0ca98 50%, #8c7343 100%);
  color: #1a120c;
  font-family: 'Montserrat', sans-serif;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  text-decoration: none;
  border: none;
  border-radius: 2px;
  cursor: pointer;
  box-shadow: 0 6px 20px rgba(0,0,0,0.5), inset 0 1px 1px rgba(255,255,255,0.6);
  transition: transform 0.3s ease, box-shadow 0.3s ease, filter 0.3s ease;
}

.btn-primary:hover {
  transform: translateY(-2px);
  box-shadow: 0 10px 28px rgba(189,160,104,0.35);
  filter: brightness(1.05);
}

.btn-secondary {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 13px 30px;
  background: rgba(255, 255, 255, 0.08);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  color: var(--ivory);
  font-family: 'Montserrat', sans-serif;
  font-size: 11px;
  font-weight: 500;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  text-decoration: none;
  border: 1px solid rgba(189, 160, 104, 0.45);
  border-radius: 2px;
  cursor: pointer;
  transition: transform 0.3s ease, background 0.3s ease, border-color 0.3s ease;
}

.btn-secondary:hover {
  transform: translateY(-2px);
  background: rgba(189, 160, 104, 0.2);
  border-color: var(--gold-light);
}

/* ─────────────────────────────────────────────────────────────
   TOP CORNER NAVIGATION CONTROLS (Sound & Replay)
   ───────────────────────────────────────────────────────────── */
.top-nav {
  position: absolute;
  top: 24px;
  right: 28px;
  z-index: 50;
  display: flex;
  gap: 12px;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.8s ease 1.8s;
}

.viewport.hero-active .top-nav {
  opacity: 1;
  pointer-events: auto;
}

.nav-ctrl-btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 8px 16px;
  background: rgba(18, 14, 13, 0.65);
  backdrop-filter: blur(8px);
  border: 1px solid rgba(189, 160, 104, 0.35);
  color: var(--gold-light);
  font-family: 'Montserrat', sans-serif;
  font-size: 10px;
  font-weight: 500;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  border-radius: 30px;
  cursor: pointer;
  transition: all 0.3s ease;
}

.nav-ctrl-btn:hover {
  background: rgba(189, 160, 104, 0.25);
  border-color: var(--gold-light);
  color: #ffffff;
}

/* ─────────────────────────────────────────────────────────────
   THE FOLDED INVITATION PANELS (Gatefold Left & Right)
   Exact match to the Pinterest reference
   ───────────────────────────────────────────────────────────── */
.flap {
  position: absolute;
  top: 0;
  bottom: 0;
  width: 50%;
  height: 100%;
  z-index: 6;
  transform-style: preserve-3d;
  backface-visibility: visible;
  background-color: #f7f4ec;
  will-change: transform, filter, opacity;
  transition: transform 1.55s var(--ease-cinematic),
              filter 1.2s ease,
              opacity 0.6s ease 1.2s;
}

.flap.left {
  left: 0;
  transform-origin: left center;
  border-right: 1px solid rgba(163, 146, 111, 0.45);
  background: linear-gradient(135deg, #fbf9f2 0%, #f4f0e7 68%, #e9e2d5 100%);
  box-shadow: 5px 0 15px rgba(0,0,0,0.06);
}

.flap.right {
  left: auto;
  right: 0;
  transform-origin: right center;
  border-left: 1px solid rgba(163, 146, 111, 0.45);
  background: linear-gradient(225deg, #fbf9f2 0%, #f4f0e7 68%, #e9e2d5 100%);
  box-shadow: -5px 0 15px rgba(0,0,0,0.06);
}

/* Elegant diagonal crease lines etched on the stationery */
.fold-lines {
  position: absolute;
  inset: 0;
  z-index: 7;
  pointer-events: none;
  transition: opacity 0.5s ease;
}

.fold-lines svg {
  width: 100%;
  height: 100%;
  display: block;
}

/* Front Cover Branding */
.front-brand {
  position: absolute;
  z-index: 12;
  top: 17%;
  left: 50%;
  width: 110px;
  height: 110px;
  object-fit: contain;
  transform: translateX(-50%);
  filter: drop-shadow(0 2px 4px rgba(86,64,37,0.12));
  transition: opacity 0.4s ease, transform 0.5s ease;
  pointer-events: none;
}



/* ─────────────────────────────────────────────────────────────
   SILVER SATIN RIBBON AND BOW (Slide down and fade on click)
   ───────────────────────────────────────────────────────────── */
.ribbon {
  position: absolute;
  left: -4%;
  right: -4%;
  top: 52%;
  height: 108px;
  z-index: 18;
  display: grid;
  place-items: center;
  pointer-events: none;
  transition: transform 1.1s var(--ease-cinematic), opacity 0.6s ease;
}

.ribbon-strip {
  position: absolute;
  left: 0;
  right: 0;
  top: 50%;
  height: 34px;
  transform: translateY(-50%);
  background: linear-gradient(180deg, #dcdbda 0%, #ffffff 20%, #eae9e7 48%, #c9c8c6 70%, #f7f6f4 100%);
  box-shadow: 0 5px 12px rgba(25, 20, 15, 0.22), inset 0 1px 0 rgba(255,255,255,0.95);
}

.ribbon-bow {
  position: relative;
  width: min(68%, 255px);
  height: auto;
  z-index: 2;
  filter: drop-shadow(0 7px 12px rgba(20, 16, 12, 0.3));
}

/* "Tap / Swipe to Open for Magic" Hint */
.open-instruction {
  position: absolute;
  z-index: 20;
  bottom: 6%;
  left: 0;
  right: 0;
  text-align: center;
  font-family: 'Montserrat', sans-serif;
  font-size: 8.5px;
  font-weight: 500;
  letter-spacing: 0.36em;
  color: #8c806f;
  text-transform: uppercase;
  pointer-events: none;
  animation: pulseHint 2.4s ease-in-out infinite;
  transition: opacity 0.3s ease;
}

@keyframes pulseHint {
  0%, 100% { opacity: 0.7; transform: translateY(0); }
  50% { opacity: 1; transform: translateY(-3px); }
}

/* ─────────────────────────────────────────────────────────────
   OPENING STATE ANIMATIONS
   ───────────────────────────────────────────────────────────── */
.viewport.is-opening .ribbon {
  transform: translateY(160%);
  opacity: 0;
}

.viewport.is-opening .flap.left {
  transform: rotateY(-124deg);
  filter: brightness(0.85);
}

.viewport.is-opening .flap.right {
  transform: rotateY(124deg);
  filter: brightness(0.85);
}

.viewport.is-opening .fold-lines,
.viewport.is-opening .front-brand,

.viewport.is-opening .open-instruction,
.viewport.hero-active .open-instruction {
  opacity: 0 !important;
  visibility: hidden;
  pointer-events: none;
}

/* As it expands to Hero, hide flaps so they don't block viewport */
.viewport.hero-active .flap {
  opacity: 0;
  pointer-events: none;
}

/* ─────────────────────────────────────────────────────────────
   RESPONSIVE DESIGN (Desktop & Mobile)
   ───────────────────────────────────────────────────────────── */
@media (max-width: 768px) {
  .card-vessel {
    width: min(84vw, 360px);
    height: min(80svh, 640px);
    min-height: 460px;
  }
  .front-brand {
    width: 90px;
    height: 90px;
    top: 18%;
  }
  .ribbon {
    top: 52%;
    height: 92px;
  }
  .ribbon-strip {
    height: 30px;
  }
  .ribbon-bow {
    width: min(72%, 225px);
  }
  .hero-crest {
    width: 70px;
    margin-bottom: 12px;
  }
  .hero-eyebrow {
    font-size: 8px;
    letter-spacing: 0.3em;
  }
  .hero-title {
    font-size: clamp(32px, 8.5vw, 44px);
    margin-bottom: 12px;
  }
  .hero-tagline {
    font-size: 15px;
    margin-bottom: 26px;
    padding: 0 10px;
  }
  .btn-primary, .btn-secondary {
    width: 100%;
    max-width: 280px;
    padding: 12px 24px;
    font-size: 10px;
  }
  .top-nav {
    top: 16px;
    right: 16px;
  }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    transition-duration: 0.01ms !important;
  }
}
</style>
</head>
<body>

<main class="viewport" id="viewport">
  <div class="ambient-glow" aria-hidden="true"></div>

  <!-- Audio Element (Wedding melody) -->
  <audio id="bgAudio" src="wedding-melody.mp3" preload="auto" loop></audio>

  <!-- Top Navigation (Audio Toggle & Replay) -->
  <header class="top-nav" aria-label="Controls">
    <button class="nav-ctrl-btn" id="audioToggle" type="button" aria-label="Toggle Sound">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path id="soundWave" d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path></svg>
      <span id="audioText">Sound</span>
    </button>
    <button class="nav-ctrl-btn" id="replayBtn" type="button" aria-label="Replay Card Opening">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="1 4 1 10 7 10"></polyline><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"></path></svg>
      <span>Replay</span>
    </button>
  </header>

  <!-- Continuous Card -> Hero Container -->
  <div class="card-vessel" id="cardVessel" role="button" tabindex="0" aria-label="Tap to open the wedding invitation">
    
    <!-- Inner Card with Live Wedding Background Video -->
    <div class="card-inner">
      <video class="wedding-video-bg" id="weddingVideo" src="wedding-table-decor.mp4" autoplay muted loop playsinline></video>
      <div class="video-overlay" aria-hidden="true"></div>
      <div class="inner-card-frame" aria-hidden="true"></div>

      <!-- Initial Card Typography (Briefly seen as flaps open before expand) -->
      <div class="card-content-initial">
        <img class="initial-logo" src="DawatNaama_Logo_Transparent.png" alt="Dawat Naama">
        <p class="initial-subtitle">Welcome to</p>
        <h2 class="initial-title">Dawat Naama</h2>
        <p class="initial-tagline">Make your invitation memorable with us</p>
      </div>

      <!-- Seamlessly Expanded Hero Section -->
      <section class="hero-content" id="heroContent" aria-label="Dawat Naama Hero Section">
        <img class="hero-crest" src="DawatNaama_Logo_Transparent.png" alt="Dawat Naama Monogram">
        <p class="hero-eyebrow">Luxury Digital Wedding Invitations</p>
        <h1 class="hero-title">Every Celebration <span>Begins With</span> An Invitation.</h1>
        <p class="hero-tagline">Make your invitation memorable with us.</p>
        <div class="hero-actions">
          <a href="#explore" class="btn-primary" id="btnExplore">Explore Invites</a>
          <a href="#consultation" class="btn-secondary" id="btnConsult">Book a Consultation</a>
        </div>
      </section>
    </div>

    <!-- Front Left & Right Gatefold Flaps -->
    <div class="flap left" aria-hidden="true"></div>
    <div class="flap right" aria-hidden="true"></div>

    <!-- Crease lines etched on the stationery -->
    <div class="fold-lines" aria-hidden="true">
      <svg viewBox="0 0 100 100" preserveAspectRatio="none">
        <path d="M0 0 L50 50 L100 0 M0 100 L50 50 L100 100" fill="none" stroke="#bda068" stroke-opacity="0.45" stroke-width="0.3"/>
        <path d="M0 0 L50 50 M0 100 L50 50 M100 0 L50 50 M100 100 L50 50" fill="none" stroke="#ffffff" stroke-opacity="0.8" stroke-width="0.5"/>
      </svg>
    </div>

    <!-- Front Logo & Initial Lettering -->
    <img class="front-brand" src="DawatNaama_Logo_Transparent.png" alt="Dawat Naama Logo">
    

    <!-- Silver Satin Ribbon with Bow -->
    <div class="ribbon" aria-hidden="true">
      <span class="ribbon-strip"></span>
      <img class="ribbon-bow" src="ribbon-bow.png" alt="">
    </div>

    <!-- Opening Prompt -->
    <p class="open-instruction">Tap / Swipe to Open for Magic</p>
  </div>
</main>

<script>
(function() {
  const viewport = document.getElementById('viewport');
  const cardVessel = document.getElementById('cardVessel');
  const weddingVideo = document.getElementById('weddingVideo');
  const bgAudio = document.getElementById('bgAudio');
  const audioToggle = document.getElementById('audioToggle');
  const audioText = document.getElementById('audioText');
  const replayBtn = document.getElementById('replayBtn');

  let isOpen = false;
  let isSoundActive = false;

  // Open Sequence: Ribbon drops -> Flaps rotate -> Card smoothly expands into Hero
  function openInvitation() {
    if (isOpen) return;
    isOpen = true;

    // Ensure video is playing
    if (weddingVideo) {
      weddingVideo.play().catch(function() {});
    }

    // Attempt audio on user gesture
    if (bgAudio && isSoundActive) {
      bgAudio.play().catch(function() {});
    }

    // Step 1: Ribbon slides down & flaps begin opening
    viewport.classList.add('is-opening');

    // Step 2: Smoothly expand into the full Hero section
    setTimeout(function() {
      viewport.classList.add('hero-active');
    }, 1200);
  }

  // Replay: Collapse Hero back to closed invitation card
  function resetInvitation() {
    viewport.classList.remove('hero-active');
    viewport.classList.remove('is-opening');
    isOpen = false;
  }

  // Interaction handlers (Click / Tap / Keyboard)
  cardVessel.addEventListener('click', function(e) {
    if (!isOpen) {
      openInvitation();
    }
  });

  cardVessel.addEventListener('keydown', function(e) {
    if ((e.key === 'Enter' || e.key === ' ') && !isOpen) {
      e.preventDefault();
      openInvitation();
    }
  });

  // Touch swipe support (Up or Across)
  let touchStartY = 0;
  let touchStartX = 0;

  cardVessel.addEventListener('touchstart', function(e) {
    touchStartX = e.changedTouches[0].clientX;
    touchStartY = e.changedTouches[0].clientY;
  }, { passive: true });

  cardVessel.addEventListener('touchend', function(e) {
    if (isOpen) return;
    const diffX = Math.abs(e.changedTouches[0].clientX - touchStartX);
    const diffY = Math.abs(e.changedTouches[0].clientY - touchStartY);
    if (diffX > 25 || diffY > 25) {
      openInvitation();
    }
  }, { passive: true });

  // Replay Button
  replayBtn.addEventListener('click', function(e) {
    e.stopPropagation();
    resetInvitation();
  });

  // Auto-open if #open or ?open
  if (window.location.hash === '#open' || window.location.search.includes('open')) {
    setTimeout(openInvitation, 300);
  }

  // Sound Toggle Button
  audioToggle.addEventListener('click', function(e) {
    e.stopPropagation();
    if (!bgAudio) return;
    if (bgAudio.paused) {
      bgAudio.play().then(function() {
        isSoundActive = true;
        audioText.textContent = 'Mute';
      }).catch(function() {});
    } else {
      bgAudio.pause();
      isSoundActive = false;
      audioText.textContent = 'Sound';
    }
  });

  // 3D Tilt Effect on Desktop Pointer Move
  cardVessel.addEventListener('mousemove', function(e) {
    if (isOpen) return;
    const rect = cardVessel.getBoundingClientRect();
    const x = e.clientX - rect.left - rect.width / 2;
    const y = e.clientY - rect.top - rect.height / 2;
    const rotX = -(y / rect.height) * 8;
    const rotY = (x / rect.width) * 8;
    cardVessel.style.transform = `rotateX(${rotX}deg) rotateY(${rotY}deg)`;
  });

  cardVessel.addEventListener('mouseleave', function() {
    if (isOpen) return;
    cardVessel.style.transform = 'rotateX(0deg) rotateY(0deg)';
  });

})();
</script>
</body>
</html>
